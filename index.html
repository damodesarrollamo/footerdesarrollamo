<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DesarrollAMO Footer</title>
  <style>
    :root {
      --bg: #0B1020;
      --text: #E8ECF7;
      --muted: #AAB3D3;
      --link: #79D7ED;
      --border: rgba(125, 211, 252, 0.12);
      --py1: #79D7ED;
      --py2: #E287B2;
      --sun: #F2B077;
    }
    body.theme-light {
      --bg: #F0F0F0;
      --text: #1A1A2E;
      --muted: #5A5A7A;
      --link: #2196F3;
      --border: rgba(33, 150, 243, 0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: transparent; }

    .da-footer {
      background: var(--bg);
      color: var(--text);
      padding: 24px 20px 20px;
      text-align: center;
      line-height: 1.5;
      width: 100%;
      border-top: 1px solid var(--border);
    }

    .da-footer__inner { display: inline-block; }

    .da-footer__logo-row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    /* Pirámides CSS */
    .da-footer__pyramids {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 32px;
    }
    .da-footer__py1 {
      width: 0; height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 20px solid var(--py1);
    }
    .da-footer__py2 {
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 28px solid var(--py2);
    }
    .da-footer__py3 {
      width: 0; height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 16px solid var(--py2);
    }
    .da-footer__sun {
      width: 12px;
      height: 12px;
      background: var(--sun);
      border-radius: 50%;
      margin-bottom: 4px;
      margin-left: 1px;
    }

    .da-footer__brand {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }
    .da-footer__brand .da-d { color: var(--link); }
    .da-footer__brand .da-a { color: #E287B2; }
    body.theme-light .da-footer__brand .da-d { color: var(--link); }

    .da-footer__client {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .da-footer__slogan {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .da-footer__credit {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .da-footer__link {
      color: var(--link);
      text-decoration: none;
      font-weight: 500;
    }
    .da-footer__link:hover { opacity: 0.75; }

    @media (max-width: 400px) {
      .da-footer__logo-row { flex-direction: column; align-items: center; gap: 6px; }
      .da-footer { padding: 20px 14px 16px; }
    }
  </style>
</head>
<body>
  <footer class="da-footer" id="da-footer">
    <div class="da-footer__inner">

      <div class="da-footer__logo-row">
        <div class="da-footer__pyramids">
          <div class="da-footer__py1"></div>
          <div class="da-footer__py2"></div>
          <div class="da-footer__py3"></div>
          <div class="da-footer__sun"></div>
        </div>
        <div class="da-footer__brand">
          <span class="da-d">Desarroll</span><span class="da-a">AMO</span>
        </div>
      </div>

      <div class="da-footer__client" id="da-client"></div>
      <div class="da-footer__slogan" id="da-slogan"></div>
      <div class="da-footer__credit">
        <span id="da-credit-text">Desarrollado por</span>
        <span> · </span>
        <a class="da-footer__link" id="da-link" href="https://desarrollamo.netlify.app/" target="_blank" rel="noopener noreferrer">DesarrollAMO</a>
      </div>

    </div>
  </footer>

  <script>
    (function() {
      var SITE_CONFIG = {
        'casaboscoarq.com.ar':      { name: 'CasaBosco',              slogan: 'Arquitectura & Diseño', theme: 'light' },
        'coviat.com.ar':            { name: 'Coviat',                  slogan: '',                      theme: 'light' },
        'remeraco.netlify.app':     { name: 'Remeraco',                slogan: '',                      theme: 'dark'  },
        'cobramo.netlify.app':      { name: 'Cobramo',                 slogan: '',                      theme: 'dark'  },
        'desarrollamo.netlify.app': { name: 'DesarrollAMO',            slogan: 'IA para todos',         theme: 'dark'  }
      };

      var host = document.location.hostname;
      var params = {};
      try {
        document.location.search.substring(1).split('&').forEach(function(p) {
          var kv = p.split('=');
          params[decodeURIComponent(kv[0])] = kv[1] ? decodeURIComponent(kv[1]) : true;
        });
      } catch(e) {}

      var cfg = SITE_CONFIG[document.referrer.split('/')[2]] || SITE_CONFIG[host] || { theme: 'dark' };
      if (params.name)   cfg.name   = decodeURIComponent(params.name);
      if (params.slogan) cfg.slogan = decodeURIComponent(params.slogan);
      if (params.theme)  cfg.theme  = params.theme;
      if (params.credit) cfg.credit = decodeURIComponent(params.credit);
      if (params.link)   document.getElementById('da-link').href = decodeURIComponent(params.link);

      if (cfg.theme === 'light') document.body.classList.add('theme-light');

      var year = new Date().getFullYear();
      var clientEl = document.getElementById('da-client');
      var sloganEl = document.getElementById('da-slogan');
      var creditEl = document.getElementById('da-credit-text');

      clientEl.textContent = cfg.name ? '© ' + year + ' ' + cfg.name : '© ' + year + ' DesarrollAMO';
      if (cfg.slogan) sloganEl.textContent = cfg.slogan;
      else sloganEl.style.display = 'none';
      if (cfg.credit) creditEl.textContent = cfg.credit;
    })();
  </script>
</body>
</html>
