<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DesarrollAMO Footer</title>
  <meta name="description" content="Footer oficial DesarrollAMO — Tecnología con alma." />
  <style>
    .amo-footer{
      position: relative;
      z-index: 999;
      padding: 18px 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: rgba(0,0,0,.58);
      color: rgba(229,231,235,.95);
      border-top: 1px solid rgba(255,255,255,.14);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    @media (prefers-color-scheme: light){
      .amo-footer{
        background: rgba(255,255,255,.78);
        color: rgba(17,24,39,.92);
        border-top: 1px solid rgba(0,0,0,.10);
      }
    }
    .amo-footer-inner{
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
    }
    .amo-text{ opacity:.85; }
    .amo-link{
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 900;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      color: inherit;
      transition: transform .15s ease, background .2s ease, border-color .2s ease;
    }
    .amo-link:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.22);
    }
    @media (prefers-color-scheme: light){
      .amo-link{ background: rgba(0,0,0,.04); border-color: rgba(0,0,0,.10); }
      .amo-link:hover{ background: rgba(0,0,0,.06); border-color: rgba(0,0,0,.16); }
    }
    .amo-sky{ color:#7DD3FC; }
    .amo-pink{ color:#FF5AA5; }
    .amo-year{ opacity:.75; }
  </style>
</head>
<body style="margin:0;padding:0;background:transparent">
  <footer class="amo-footer">
    <div class="amo-footer-inner">
      <span class="amo-text">Página desarrollada por</span>

      <a class="amo-link" href="https://desarrollamo.netlify.app/" target="_blank" rel="noopener noreferrer">
        <span class="amo-logo" aria-hidden="true">
          <svg width="30" height="22" viewBox="0 0 78 48" style="display:block">
            <polygon points="8,40 20,16 32,40" fill="#7DD3FC"></polygon>
            <polygon points="24,40 36,12 48,40" fill="#FF5AA5"></polygon>
            <polygon points="40,40 52,20 60,40" fill="#FF5AA5"></polygon>
            <circle cx="69" cy="29" r="10.5" fill="#FFD166" opacity="0.16"></circle>
            <circle cx="69" cy="29" r="7.8"  fill="#FFD166"></circle>
          </svg>
        </span>

        <span class="amo-brand">
          <span class="amo-sky">Desarroll</span><span class="amo-pink">AMO</span><span class="amo-sky">.</span>
        </span>
      </a>

      <span class="amo-year">© <span id="amoYear"></span></span>
    </div>

    <script>
      document.getElementById('amoYear').textContent = new Date().getFullYear();
    </script>
  </footer>
</body>
</html>
